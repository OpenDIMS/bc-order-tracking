name: Build BC extension

# Compiles this AL extension into a .app file and uploads it as a workflow artifact
# (always) and as a GitHub release asset (when triggered by a tag push or a release event).
#
# Uses BcContainerHelper's compiler-folder pattern — no Docker, no Windows container,
# just the bare compiler downloaded from Microsoft's BC artifacts CDN.
#
# To cut a release, push a tag matching v* or bc-ext-v* (e.g. `git tag v1.0.1 && git push origin v1.0.1`).
# The workflow builds the .app, creates the GitHub release if it doesn't exist yet,
# and attaches the .app to it. Creating a release from the GitHub UI also works.

on:
  push:
    branches: [develop, main]
    # Tag push triggers a release build — softprops/action-gh-release creates the release if missing.
    tags:
      - 'v*'
      - 'bc-ext-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      bcVersion:
        description: 'BC platform version to compile against (e.g. 22.0). Leave empty to use the version from app.json.'
        required: false
        default: ''
  release:
    types: [ created, published ]

jobs:
  build:
    name: Compile .app
    # AL compiler runs on Linux too, but the Windows runner has a pre-warmed cache
    # of .NET + PowerShell and consistently builds in 4-6 minutes cold, ~1 min warm.
    runs-on: windows-latest

    permissions:
      contents: write  # needed by softprops/action-gh-release on release events

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache BcContainerHelper artifacts
        uses: actions/cache@v4
        with:
          path: ~/.bcartifacts.cache
          # Bump suffix when bumping major BC platform version in app.json.
          key: bcartifacts-v22-${{ runner.os }}

      - name: Run build.ps1
        shell: pwsh
        env:
          BC_VERSION_OVERRIDE: ${{ inputs.bcVersion }}
        run: |
          $outFolder = Join-Path $PWD 'out'
          $script    = Join-Path $PWD 'build.ps1'
          if ($env:BC_VERSION_OVERRIDE) {
              & $script -OutputFolder $outFolder -BcVersion $env:BC_VERSION_OVERRIDE
          } else {
              & $script -OutputFolder $outFolder
          }
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit $LASTEXITCODE" }

      - name: Read app.json version
        id: appjson
        shell: pwsh
        run: |
          $appJson = Get-Content app.json -Raw | ConvertFrom-Json
          "appVersion=$($appJson.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendims-bc-extension-${{ steps.appjson.outputs.appVersion }}
          path: out/opendims-bc-extension.app
          if-no-files-found: error
          retention-days: 90

      - name: Zip .app for release upload
        # GitHub Releases rejects bare .app files (the extension is reserved for macOS app
        # bundles). Wrap it in a .zip; customers extract the .app from the archive after download.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path out/opendims-bc-extension.app -DestinationPath out/opendims-bc-extension.zip -Force
          Get-Item out/opendims-bc-extension.zip | Format-List FullName, Length

      - name: Create / attach to GitHub release
        # Fires on either: a tag push matching the triggers above, OR a release created in the UI.
        # softprops/action-gh-release creates the release when the tag has none yet, otherwise it
        # attaches the .zip to the existing release for that tag.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/opendims-bc-extension.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
