stages:
  - build
  - release

# Reusable rules for the bc-extension subtree only.
.bc_extension_rules: &bc_extension_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bc-extension/**/*
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes:
        - bc-extension/**/*
    - if: $CI_PIPELINE_SOURCE == "web"

# Compile bc-extension/ into opendims-bc-extension.app.
# Uses PowerShell 7 on Linux + BcContainerHelper's cross-platform compiler-folder mode.
# No Docker-in-Docker, no Windows runner required.
build_bc_extension:
  <<: *bc_extension_rules
  stage: build
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  variables:
    # Cache BcContainerHelper's downloaded artifacts between jobs to skip the ~300MB
    # platform-symbol download on every run.
    BCCONTAINERHELPER_BCARTIFACTS_CACHE_FOLDER: $CI_PROJECT_DIR/.bcartifacts.cache
    POWERSHELL_TELEMETRY_OPTOUT: '1'
  cache:
    key: bcartifacts-v22
    paths:
      - .bcartifacts.cache/
  script:
    - pwsh -NoProfile -File bc-extension/build.ps1 -OutputFolder "$CI_PROJECT_DIR/bc-extension-out"
  artifacts:
    name: opendims-bc-extension-$CI_COMMIT_SHORT_SHA
    paths:
      - bc-extension-out/opendims-bc-extension.app
    expire_in: 90 days

# On tags like bc-ext-v1.0.0.0, publish the compiled .app to the GitLab generic package registry.
# Customers (and the OpenDIMS public/downloads/ host) can then pull it from a stable URL.
publish_bc_extension:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: build_bc_extension
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^bc-ext-/
  script:
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file bc-extension-out/opendims-bc-extension.app \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/bc-extension/$CI_COMMIT_TAG/opendims-bc-extension.app"
